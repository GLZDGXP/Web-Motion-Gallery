  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-deep: #05060a;
      --bg-mid: #0a0d18;
      --text-primary: #e8ecff;
      --text-secondary: #8892b0;
      --text-muted: #5a6485;
      --font-display: 'Space Grotesk', 'Noto Sans SC', sans-serif;
      --font-body: 'Noto Sans SC', 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    html { scroll-behavior: smooth; }
    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-body);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(80, 50, 180, 0.12), transparent),
        var(--bg-deep);
      background-attachment: fixed;
    }
    ::selection { background: rgba(0, 229, 255, 0.25); color: #fff; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(120, 150, 255, 0.2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(120, 150, 255, 0.35); }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-deep);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .loading-screen.hidden { opacity: 0; visibility: hidden; }
    .loading-logo {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #00e5ff, #b14dff);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      color: #0a0d18;
      animation: loading-pulse 1.5s ease-in-out infinite;
    }
    @keyframes loading-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.8; }
    }
    .loading-text {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 2px;
    }
    .loading-bar {
      width: 140px;
      height: 2px;
      background: rgba(120, 150, 255, 0.1);
      border-radius: 1px;
      overflow: hidden;
    }
    .loading-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00e5ff, #b14dff);
      animation: loading-progress 1.5s ease-in-out infinite;
    }
    @keyframes loading-progress {
      0% { width: 0%; margin-left: 0; }
      50% { width: 55%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .reveal-item, .reveal-header,
      .section-header .section-eyebrow,
      .section-header .section-title,
      .section-header .section-subtitle {
        opacity: 1 !important;
        transform: none !important;
      }
    }
    /* v1.0.2 增强样式——性能 / 可访问性 / 体验 / 稳定性 */
    .perf-notice { display: none; }
    .error-stats-panel { display: none; }
    .card-recovery-indicator { display: none; }
  </style>
